<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Pramaan Helpdesk</title><link rel="icon" href="/assets/helpdesk/desk/favicon.svg"><style>
:root{--ground:#ededed;--card:#ffffff;--line:rgba(0,0,0,0.08);--fg:#111111;--fg-2:#454545;--fg-3:#5f5f5f;--ink:rgba(17,17,17,0.88);--ink-solid:#111111;--on-ink:#ffffff;--focus:#2b59d1;--serif:"Fraunces Variable","Fraunces",Georgia,"Times New Roman",serif;--sans:"Geist Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body{font-family:var(--sans);background:var(--ground);color:var(--fg);margin:0;min-height:100vh;display:grid;place-items:center}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 520px at 85% -10%,rgba(20,20,20,0.14),transparent 65%),radial-gradient(700px 500px at -10% 110%,rgba(20,20,20,0.14),transparent 65%),radial-gradient(600px 400px at 35% 40%,rgba(255,255,255,0.9),transparent 70%)}
main{width:min(360px,calc(100vw - 64px));padding:32px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.9),0 1px 2px rgba(0,0,0,0.04)}
h1{font-family:var(--serif);font-weight:400;font-size:26px;letter-spacing:-0.02em;margin:12px 0 0}
label{display:block;margin-top:20px;font-size:13px;font-weight:500;color:var(--fg-2)}
input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border-radius:12px;border:1px solid var(--line);font:inherit;font-size:14px;background:var(--card);color:var(--fg)}
input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button{margin-top:24px;background:var(--ink);border-color:rgba(255,255,255,0.18);color:var(--on-ink);cursor:pointer;font-weight:500}
button:hover{background:var(--ink-solid)}
button:disabled{opacity:0.55;cursor:not-allowed}
p{font-size:13px;line-height:1.5;color:var(--fg-2)}
#error{color:#b91c1c}
a{color:#2b59d1}
</style></head><body><main><img src="/assets/helpdesk/desk/favicon.svg" width="48" height="48" alt=""><h1>Pramaan Helpdesk</h1><p>Sign in to your support workspace.</p><form id="login"><label for="email">Email or username</label><input id="email" name="usr" autocomplete="username" required><label for="password">Password</label><input id="password" name="pwd" type="password" autocomplete="current-password" required><button type="submit">Sign in</button><p id="error" role="alert"></p></form><div id="social" hidden><hr style="margin:20px 0 0;border:0;border-top:1px solid var(--line)"><button id="social-btn" type="button" style="margin-top:16px;background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:500">Continue with single sign-in</button><p id="social-error" role="alert" style="color:#9b2c2c"></p></div></main><script>
(async function(){
try{
const status=await fetch('/api/method/helpdesk.api.social.status',{credentials:'same-origin'});
if(!status.ok)return;
if(!(await status.json()).message.enabled)return;
document.getElementById('social').hidden=false;
document.getElementById('social-btn').addEventListener('click',async function(){
const button=this;button.disabled=true;document.getElementById('social-error').textContent='';
try{
const response=await fetch('/api/method/helpdesk.api.social.start',{credentials:'same-origin'});
if(!response.ok)throw Error();
const url=(await response.json()).message.authorizeUrl;
location.assign(url);
}catch{
document.getElementById('social-error').textContent='Could not start sign-in. Try again.';
button.disabled=false;}
});
}catch{}
})();
</script><script>document.querySelector('#login').addEventListener('submit',async event=>{event.preventDefault();const button=document.querySelector('button');button.disabled=true;document.querySelector('#error').textContent='';try{const response=await fetch('/api/method/login',{method:'POST',body:new FormData(event.target),credentials:'same-origin'});if(!response.ok)throw Error();const query=new URLSearchParams(location.search);const target=query.get('redirect-to');location.assign(target&&target.startsWith('/helpdesk')?target:'/helpdesk');}catch{document.querySelector('#error').textContent='Could not sign in. Check your details and try again.';button.disabled=false;}});
const socialNotice={cancelled:'Sign-in was cancelled.',expired:'The sign-in link expired. Start again.',rejected:'Sign-in was refused. Try again.',unknown:'No account matches this email. Ask your administrator to invite you.',unavailable:'Sign-in is not available right now.'}[new URLSearchParams(location.search).get('social')];
if(socialNotice)document.querySelector('#error').textContent=socialNotice;</script></body></html>
