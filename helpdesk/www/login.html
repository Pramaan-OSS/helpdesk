<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Pramaan Helpdesk</title><link rel="icon" href="/assets/helpdesk/desk/favicon.svg"><style>body{font-family:system-ui,sans-serif;background:#f5f7f6;color:#183a34;margin:0;min-height:100vh;display:grid;place-items:center}main{width:min(360px,calc(100vw - 64px));padding:32px;background:white;border:1px solid #dce6e2;border-radius:16px}h1{font-size:24px}label{display:block;margin-top:20px;font-size:14px}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border-radius:8px;border:1px solid #bbcfc6;font:inherit}button{margin-top:24px;background:#174f46;color:white;cursor:pointer}p{font-size:14px;line-height:1.5}#error{color:#9b2c2c}a{color:#174f46}</style></head><body><main><img src="/assets/helpdesk/desk/favicon.svg" width="48" height="48" alt=""><h1>Pramaan Helpdesk</h1><p>Sign in to your support workspace.</p><form id="login"><label for="email">Email or username</label><input id="email" name="usr" autocomplete="username" required><label for="password">Password</label><input id="password" name="pwd" type="password" autocomplete="current-password" required><button type="submit">Sign in</button><p id="error" role="alert"></p></form><p>Social sign-in is not available yet.</p></main><script>document.querySelector('#login').addEventListener('submit',async event=>{event.preventDefault();const button=document.querySelector('button');button.disabled=true;document.querySelector('#error').textContent='';try{const response=await fetch('/api/method/login',{method:'POST',body:new FormData(event.target),credentials:'same-origin'});if(!response.ok)throw Error();const query=new URLSearchParams(location.search);const target=query.get('redirect-to');location.assign(target&&target.startsWith('/helpdesk')?target:'/helpdesk');}catch{document.querySelector('#error').textContent='Could not sign in. Check your details and try again.';button.disabled=false;}});</script></body></html>
